# One broker (KRaft): an in-cluster listener for the services, and one the suite reaches from the
# host through the node port.
apiVersion: apps/v1
kind: Deployment
metadata: {name: kafka, namespace: stormbreaker-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: kafka}}
  template:
    metadata: {labels: {app: kafka}}
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "INTERNAL://kafka:9092,EXTERNAL://localhost:18093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: INTERNAL}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_NUM_PARTITIONS, value: "2"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true"}
---
apiVersion: v1
kind: Service
metadata: {name: kafka, namespace: stormbreaker-lab}
spec:
  selector: {app: kafka}
  ports: [{port: 9092, targetPort: 9092}]
---
apiVersion: v1
kind: Service
metadata: {name: kafka-external, namespace: stormbreaker-lab}
spec:
  type: NodePort
  selector: {app: kafka}
  ports: [{port: 9094, targetPort: 9094, nodePort: 30093}]
