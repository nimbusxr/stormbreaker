apiVersion: apps/v1
kind: Deployment
metadata: {name: tracking, namespace: stormbreaker-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: tracking}}
  template:
    metadata: {labels: {app: tracking}}
    spec:
      containers:
        - name: tracking
          image: stormbreaker-lab:dev
          imagePullPolicy: Never
          command: [tracking]
          env:
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
            - {name: DATABASE_URL, value: "postgres://tracking:lab-only-password@postgres:5432/tracking"}
            - {name: COURIER_URL, value: "http://courier:8080"}
          ports: [{containerPort: 8082}]
          readinessProbe: {httpGet: {path: /ping, port: 8082}}
