# Confluent's Schema Registry, for the Avro events: the suite reaches it from the host.
apiVersion: apps/v1
kind: Deployment
metadata: {name: schema-registry, namespace: stormbreaker-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: schema-registry}}
  template:
    metadata: {labels: {app: schema-registry}}
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.7.1
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081"}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "kafka:9092"}
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /subjects, port: 8081}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: schema-registry, namespace: stormbreaker-lab}
spec:
  type: NodePort
  selector: {app: schema-registry}
  ports: [{port: 8081, targetPort: 8081, nodePort: 30094}]
