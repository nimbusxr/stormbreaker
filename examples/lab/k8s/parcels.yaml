# The parcels team's service in two regions, behind one front door; each region also has a
# service of its own, for its admin door and its Prometheus.
apiVersion: apps/v1
kind: Deployment
metadata: {name: parcels-east, namespace: stormbreaker-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: parcels, region: east}}
  template:
    metadata: {labels: {app: parcels, region: east}}
    spec:
      containers:
        - name: parcels
          image: stormbreaker-lab:dev
          imagePullPolicy: Never
          command: [parcels]
          env:
            - {name: REGION, value: east}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /ping, port: 8081}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: parcels-west, namespace: stormbreaker-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: parcels, region: west}}
  template:
    metadata: {labels: {app: parcels, region: west}}
    spec:
      containers:
        - name: parcels
          image: stormbreaker-lab:dev
          imagePullPolicy: Never
          command: [parcels]
          env:
            - {name: REGION, value: west}
            - {name: KAFKA_BROKERS, value: "kafka:9092"}
          ports: [{containerPort: 8081}]
          readinessProbe: {httpGet: {path: /ping, port: 8081}}
---
apiVersion: v1
kind: Service
metadata: {name: parcels, namespace: stormbreaker-lab}
spec:
  type: NodePort
  selector: {app: parcels}
  ports: [{port: 8081, targetPort: 8081, nodePort: 30081}]
---
apiVersion: v1
kind: Service
metadata: {name: parcels-east, namespace: stormbreaker-lab}
spec:
  selector: {app: parcels, region: east}
  ports: [{port: 8081, targetPort: 8081}]
---
apiVersion: v1
kind: Service
metadata: {name: parcels-west, namespace: stormbreaker-lab}
spec:
  selector: {app: parcels, region: west}
  ports: [{port: 8081, targetPort: 8081}]
