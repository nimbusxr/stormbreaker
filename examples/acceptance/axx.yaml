# yaml-language-server: $schema=https://axx.nimbusxr.us/schemas/v0/axx.schema.json
#
# The lab's acceptance suite: smoke and load scenarios for the parcels and tracking teams, run from
# the CI runner against the environment (the kind lab, or ../lab/scripts/local.sh on one machine).
# axx starts nothing here: the environment is shared and already running.
#   axx run                          # every feature
#   axx run --tags 'not @lab'        # what runs against local.sh, without Kafka and Prometheus
version: 1

run:
  paths: [features]

resources: ["."]

# ${sys:...} in the features; override with -D name=value.
properties:
  parcels.url: http://localhost:18081
  kafka.brokers: localhost:18093
  schema-registry.url: http://localhost:18094
  prometheus.urls: http://localhost:18091,http://localhost:18092

packs:
  stormbreaker-core:
    url: ${env:STORMBREAKER_ORCHESTRATOR_URL:-http://localhost:18080}
    token: ${env:STORMBREAKER_TOKEN:-}
    # The fixture factories and the streams.
    fixtures: data
  stormbreaker-rest:
    timeout: 10s
